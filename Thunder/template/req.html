<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exotic Rips • {{ file_name }}</title>
    <meta property="og:title" content="Stream {{ file_name }} • Exotic Rips">
    <meta property="og:description" content="Instant stream powered by Exotic Rips">
    <meta property="og:image" content="https://cdn.jsdelivr.net/gh/fyaz05/Resources@main/FileToLink/live.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#0f172a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg: #020617;
            --panel: rgba(15, 23, 42, 0.75);
            --accent: #7c3aed;
            --accent-2: #22d3ee;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --border: rgba(226, 232, 240, 0.08);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
            color: var(--text);
            background: radial-gradient(circle at 20% 20%, rgba(124,58,237,0.18), transparent 35%),
                        radial-gradient(circle at 80% 30%, rgba(34,211,238,0.18), transparent 35%),
                        var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px;
        }
        .shell {
            width: min(1100px, 100%);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.45);
            backdrop-filter: blur(12px);
            overflow: hidden;
            position: relative;
        }
        .glow {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 20%, rgba(124,58,237,0.12), transparent 30%),
                        radial-gradient(circle at 80% 80%, rgba(34,211,238,0.12), transparent 35%);
            filter: blur(40px);
            pointer-events: none;
        }
        header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
        }
        .title {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }
        .subtitle {
            color: var(--muted);
            font-size: 14px;
        }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(124,58,237,0.12);
            color: #e9d5ff;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid rgba(124,58,237,0.35);
            font-size: 13px;
        }
        .chip svg { width: 14px; height: 14px; }
        .player-wrap {
            position: relative;
            aspect-ratio: 16 / 9;
            border-bottom: 1px solid var(--border);
            background: #0b1224;
        }
        media-player {
            width: 100%;
            height: 100%;
            display: block;
        }
        media-video-layout {
            --brand: var(--accent);
            --controls-color: #e2e8f0;
            --controls-shadow: 0 10px 32px rgba(0,0,0,0.45);
        }
        .actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            padding: 18px 24px 24px;
            background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent 35%);
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            background: rgba(255,255,255,0.02);
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .btn svg { width: 18px; height: 18px; }
        .btn.primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border-color: transparent;
            color: #0b1224;
            box-shadow: 0 10px 30px rgba(124,58,237,0.3);
        }
        .btn:hover { transform: translateY(-1px); border-color: rgba(255,255,255,0.16); }
        .btn.primary:hover { box-shadow: 0 12px 34px rgba(124,58,237,0.35); }
        footer {
            padding: 14px 24px 18px;
            border-top: 1px solid var(--border);
            font-size: 13px;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }
        @media (max-width: 720px) {
            body { padding: 16px; }
            header { flex-direction: column; align-items: flex-start; }
            .actions { grid-template-columns: 1fr; }
        }
    </style>
    <script type="module" src="https://cdn.vidstack.io/player"></script>
</head>
<body>
    <div class="shell">
        <div class="glow"></div>
        <header>
            <div class="title">
                <h1>{{ file_name }}</h1>
                <div class="subtitle">Streaming via Exotic Rips</div>
            </div>
            <span class="chip" id="statusChip">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" opacity="0.25"></circle>
                    <path d="M12 6v6l4 2" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
                Ready to play
            </span>
        </header>

        <div class="player-wrap">
            <media-player id="player" title="{{ file_name }}" playsinline keyTarget="document">
                <media-provider></media-provider>
                <media-video-layout></media-video-layout>
            </media-player>
        </div>

        <div class="actions">
            <a class="btn primary" href="{{ src }}" download="{{ file_name }}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v10" stroke-linecap="round"></path>
                    <path d="M6 11l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"></path>
                    <path d="M5 19h14" stroke-linecap="round"></path>
                </svg>
                Download
            </a>
            <button class="btn" id="copyBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke-linecap="round"></path>
                </svg>
                Copy Link
            </button>
            <button class="btn" id="openExternal">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 3h7v7" stroke-linecap="round"></path>
                    <path d="M10 14 21 3" stroke-linecap="round"></path>
                    <path d="M5 5v14h14" opacity="0.6"></path>
                </svg>
                Open Externally
            </button>
        </div>

        <footer>
            <span>&copy; <span id="year"></span> Exotic Rips</span>
            <span>Fast streaming • Clean links • Built for sharing</span>
        </footer>
    </div>

    <script type="module">
        const player = document.querySelector('media-player');
        if (player) {
            player.src = "{{ src }}";
        }

        const copyBtn = document.getElementById('copyBtn');
        copyBtn?.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText("{{ src }}");
                copyBtn.textContent = "Link Copied";
                setTimeout(() => copyBtn.textContent = "Copy Link", 1400);
            } catch (err) {
                copyBtn.textContent = "Copy Failed";
                setTimeout(() => copyBtn.textContent = "Copy Link", 1400);
            }
        });

        const openExternal = document.getElementById('openExternal');
        openExternal?.addEventListener('click', () => {
            window.open("intent://{{ src }}#Intent;scheme=https;end", '_blank');
        });

        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
