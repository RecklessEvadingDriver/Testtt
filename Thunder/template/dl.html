<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exotic Rips • Downloading {{ file_name }}</title>
    <meta http-equiv="refresh" content="0;url={{ src }}">
    <meta property="og:title" content="Download {{ file_name }} • Exotic Rips">
    <meta property="og:description" content="Your download will begin automatically.">
    <meta property="og:image" content="https://cdn.jsdelivr.net/gh/fyaz05/Resources@main/FileToLink/live.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg: #0b1224;
            --panel: #0f172a;
            --border: rgba(226,232,240,0.08);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: linear-gradient(135deg, #7c3aed, #22d3ee);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
            color: var(--text);
            background: radial-gradient(circle at 25% 20%, rgba(124,58,237,0.18), transparent 32%),
                        radial-gradient(circle at 80% 30%, rgba(34,211,238,0.16), transparent 30%),
                        var(--bg);
        }
        .card {
            width: min(540px, 100%);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 28px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }
        h1 { margin: 0 0 12px; font-size: 22px; }
        p { margin: 8px 0; color: var(--muted); }
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.02);
            font-weight: 600;
            margin: 10px 0 18px;
        }
        .pill svg { width: 18px; height: 18px; }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 16px;
            border-radius: 12px;
            border: none;
            color: #0b1224;
            background: var(--accent);
            text-decoration: none;
            font-weight: 700;
            box-shadow: 0 15px 32px rgba(124,58,237,0.35);
            margin-top: 6px;
        }
        .btn svg { width: 18px; height: 18px; }
        footer { margin-top: 16px; font-size: 13px; color: var(--muted); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Preparing your download</h1>
        <div class="pill">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v10" stroke-linecap="round"></path>
                <path d="M6 11l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
            {{ file_name }}
        </div>
        <p>Your download should start automatically.</p>
        <p>If it doesn't, use the button below.</p>
        <a class="btn" href="{{ src }}" download="{{ file_name }}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v10" stroke-linecap="round"></path>
                <path d="M6 11l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M5 19h14" stroke-linecap="round"></path>
            </svg>
            Download now
        </a>
        <footer>
            Exotic Rips • Fast links that just work
        </footer>
    </div>
</body>
</html>
